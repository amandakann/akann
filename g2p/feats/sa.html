ipāsākula udakapānārthaṁ yamunātaṭam avatīrṇaḥ saṁjīvakasya gaṁbhīratararāvaṁ dūrād evāśr̥ṇot.","# ptext(78) = tat ca SrutvA sArTa vAhaH kzaRa mAtram duHKam kftvA kftajYatayA ca pra ita kfti Adi kriyAm kftvA maTurAm a viGnena sam pra AptaH","# ryder(78) = And the merchant, feeling grieved for a mere moment, out of gratitude performed a ceremony that included rites for the departed, then journeyed without hindrance to Mathura.","# ptext(79) = aTa saYjIvakaH sva BAgyAnAm vaSAt AyuH SezatayA ca nirJara udaka kaRa prakArEH A SvAsita SarIraH SanEH SanEH yamunA kacCam ava tIrRaH","# ryder(79) = In the meantime, Lively, since his fate willed it and further life was predestined, hobbled step by step to the bank of the Jumna, his body invigorated by a mist of spray from the cascades.","# ptext(80) = tasmin ca marakata sadfSAni Sazpa pallava agrARi Bakzayan katipayEH ahoBiH hara vfzaBaH iva pInaH kakudmAn balavAn ca sam vfttaH","# ryder(80) = There he browsed on the emerald tips of grass-blades, and in a few days grew plump as Shiva's bull, high-humped, and full of energy.","# ptext(81) = prati aham valmIka SiKarARi SfNga agra GawwanEH ut liKan dantivat tizWati","# ryder(81) = Every day he tore the tops of ant-hills with goring horns, and frisked like an elephant.","# translit = atha kadācit piṅgalakaḥ nāma siṁhaḥ sarvamr̥gaparivr̥taḥ pipāsākula udakapānārtham yamunātaṭamavatīrṇaḥ","# text_en = But once a lion named Pingalaka, surrounded by animals and thirsty, came down to the bank of Yamuna for water.","# orig = panchatantra.conllu sent_id 82","# ptext = aTa kadAcit sarva mfga pari vftaH piNgalakaH nAma siMhaH udaka grahaRa arTam yamunA kacCam ava tIrRaH","# ryder = But one day a lion named Rusty, with a retinue of all kinds of animals, came down to the bank of the Jumna for water."],"rows":[["1","अथ","ADV","","thus",[],"_","_",[]],["2","कदाचित्","ADV","","once",[],"PronType=Ind","_",[]],["3","पिङ्गलकः","PROPN","","Pingalaka",[],"Case=Nom|Gender=Masc|Number=Sing","_",[]],["4","नाम","NOUN","","name",[],"Case=Nom|Gender=Neut|Number=Sing","_",[]],["5","सिंहः","NOUN","","lion",[],"Case=Nom|Gender=Masc|Number=Sing","_",[]],["6","सर्व","DET","","all",[],"Compound=Yes|PronType=Tot","_",[]],["7","मृग","NOUN","","animals",[],"Compound=Yes","_",[]],["8","परिवृतः","VERB","","surrounded",[],"Case=Nom|Gender=Masc|Number=Sing|Tense=Past|VerbForm=Part|Voice=Pass","_",[]],["9","पिपासा","NOUN","","thirst",[],"Compound=Yes","_",[]],["10","कुल","ADJ","","multitude",[],"Case=Nom|Gender=Masc|Number=Sing","_",[]],["11","उदक","NOUN","","water",[],"Compound=Yes","_",[]],["12","पान","NOUN","","drinking",[],"Compound=Yes","_",[]],["13","अर्थम्","NOUN","","reason",[],"Case=Acc|Gender=Neut|Number=Sing","_",[]],["14","यमुना","PROPN","","Yamuna",[],"Compound=Yes","_",[]],["15","तटम्","NOUN","","bank",[],"Case=Acc|Gender=Masc|Number=Sing","_",[]],["16","अवत्र्णः","VERB","","descended",[],"Case=Nom|Gender=Masc|Number=Sing|Tense=Past|VerbForm=Part|Voice=Pass","_",[]]]},"panc1.s84":{"comments":["# text = सञ्जीवकस्य गम्भीरतररावम् दूरादेवाशृणोत्।","# translit = sañjīvakasya gambhīratararāvam dūrādevāśr̥ṇot.","# orig = panchatantra.conllu sent_id 83","# ptext = sa ca saYjIvakasya mahAntam garjita Sabdam aSfRot tam ca SrutvA atIva kzuBita hfdayaH svakIyam AkAram pra CAdya maRqala vawasya aDastAt catur maRqala avasTAnena ava sTitaH","# ryder = There he heard Lively's prodigious bellow. The sound troubled his heart exceedingly, but he concealed his inner feelings while beneath a spreading banyan tree he drew up his company in what is called the Circle of Four."],"rows":[["1","सञ्जीवकस्य","PROPN","","Sanjivaka's",[],"Case=Gen|Gender=Masc|Number=Sing","_",[]],["2","गम्भीर","ADJ","","profound",[],"Compound=Yes","_",[]],["3","तर","ADJ","","long-range",[],"Compound=Yes","_",[]],["4","रावम्","NOUN","","roar",[],"Case=Acc|Gender=Masc|Number=Sing","_",[]],["5","दूर","ADJ","","distant",[],"_","_",[]],["6","आशृणोत्","VERB","","heard",[],"Mood=Ind|Number=Sing|Person=3|Tense=Imp|VerbForm=Fin|Voice=Act","_",[]],["7","।","PUNCT","",".",[],"_","_",[]]]},"panc1.s99":{"comments":["# text = तौ परस्परम् विचारम् आरब्धौ।","# wtext = तौ च परस्परं मंत्रयतः।","# wtranslit = tau ca parasparaṁ maṁtrayataḥ.","# (This sentence corresponds to the second part of panchatantra.conllu sent_id 83, see above.)","# ptext(84) = Aha ca catuH maRqala avasTAna nAmAni","# ryder(84) = Now the divisions of the Circle of Four are given as:","# ptext(85) = siMhaH siMha anu yAyI kAkara vargaH kim vfttaH ca iti maRqalAni","# ryder(85) = (1) the lion, (2) the lion's guard, (3) the understrappers, (4) the menials.","# ptext(86) = tatra sarvezu eva nagara pattana aDi saTAna Kewaka vawa bARa agra hAra kAnana vana sTAnezu ekaH eva siMha sTAnIyaH Bavati","# ryder(86) = In all cities, capitals, towns, hamlets, market-centers, settlements, border-posts, land-grants, monasteries, and communities there is just one occupant of the lion's post.","# ptext(87) = katipayAH siMha anu yAyinaH tatra carAH","# ryder(87) = Relatively few are active as the lion's guard.","# ptext(88) = kAkara vargaH maDyama vargaH","# ryder(88) = The understrappers are the indiscriminate throng.","# ptext(89) = kim vfttAH vana anta sTAna vAsinaH","# ryder(89) = The menials are posted on the outskirts.","# ptext(90) = uttama maDyama aDamAH trayaH iti","# ryder(90) = The three classes are each divided into members high, middle, and low.","# pparagraph","# ptext(91) = aTa piNgalakaH sa amAtyaH sa suhft janaH Cattra cAmara vyajana vAhana vilAsa vistAra vi rahitam a kftrima sAhasa rasa eka anta darpa ut hatam aBagramAna mada utsekam a sahamAnatayA svayam grAha nir aNkuSa darSita ESvaryam an aBijYam itara jana sevitAnAm kfpaRa vacasAm amarza roza saMramBa garva prasTAnam a kAtaratva puruzArTam anu kzipta aYjali puwam a dInam a BItam a kfta cAwu karma upAyam vyavasAya pOruza aBimAna ava stamBa BAsuram an anya sevi niHsaNgam an AtmamBari paropakAra suKa vi akta puruza kAra Palam a pari BUtam a kfSam a tucCam apa gata durga prati samskAra cittam a gaRita aya vyayam a vilomam an A yattam ut hata upa arjita arjita pratApa vizamam azAqruRya sampraDAraRam a praharaRa ABaraRam a sADAraRa viBava grAsam a parokza vfttam an A SaNkanIyam an apekzita kalatra parzRi grAha asAra Akrandam a nindyam a Gawita a Sikzita astf ara yogam an icCa viGAti parijana nirapekza labDa grAsa nivAsa sOhityam vana Antare niHSaNkam niHsADvasam uccEH SiraH rAjatvam anu baBUva","# ryder(91) = Now Rusty, with counselors and intimates, enjoyed a kingship of the following order. His royal office, though lacking the pomp of umbrella, flyflap, fan, vehicle, and amorous display, was held erect by sheer pride in the sentiment of unaffected pluck. It showed unbroken haughtiness and abounding self-esteem. It manifested a native zeal for unchecked power that brooked no rival. It was ignorant of cringing speech, which it delegated to those who like that sort of thing. It functioned by means of impatience, wrath, haste, and hauteur. Its manly goal was fearlessness, disdaining fawning, strange to obsequiousness, unalarmed. It made use of no wheedling artifices, but glittered in its reliance on enterprise, valor, dignity. It was independent, unattached, free from selfish worry. It advertised the reward of manliness by its pleasure in benefiting others. It was unconquered, free from constraint and meanness, while it had no thought of elaborating defensive works. It kept no account of revenue and expenditure. It knew no deviousness nor time-serving, but was prickly with the energy earned by loftiness of spirit. It wasted no deliberation on the conventional six expedients, nor did it hoard weapons or jewelry. It had an uncommon appetite for power, never adopted subterfuges, was never an object of suspicion. It paid no heed to wives or ambush-layers, to their torrents of tears or their squeals. It was without reproach. It had no artificial training in the use of weapons, but it did not disappoint expectations. It found satisfactory food and shelter without dependence on servants. It had no timidity about any foreign forest, and no alarms. Its head was high.","# ptext(92) = uktam ca","# ryder(92) = As the proverb says:","# ptext(93) = ekAkini vanavAsinI a rAja lakzmaRI a nIti SAstra jYe sattva utkawe mfga patO rAjA iti giraH pari namanti","# ryder(93) = The lion needs, in forest station, // No trappings and no education, // But lonely power and pride; // And all the song his subjects sing, // Is in the words: \"O King! O King!\" // No epithet beside.","# ptext(94) = kim ca","# ryder(94) = And again:","# ptext(95) = na aBizekaH na saMskAraH siMhasya kriyate mfgEH vikrama arjita vittasya svayam eva mfgendratA","# ryder(95) = The lion needs, for his appointing, // No ceremony, no anointing; // His deeds of heroism bring // Him fortune. Nature crowns him king.","# ptext(96) = sadA manda mada syandi mAtaNga piSita aSanaH a sam panna Ipsita AhArah tfRAni atti na kesarI","# ryder(96) = The elephant is the lion's meat, // With drops of trickling ichor sweet; // Though lack thereof should come to pass, // The lion does not nibble grass.","# wparagraph","# ptext(97) = tasya ca karawaka damanaka nAmAnO AnO dvO SfgAlO Brazwa aDikArO mantri putrO AstAm","# ryder(97) = Now Rusty had in his train two jackals, sons of counselors, but out of a job. Their names were Cheek and Victor.","# translit = tau parasparam vicāram ārabdhau.","# orig = panchatantra.conllu sent_id 98","# ptext = tO ca parasparam mantrayitum A rabDO","# ryder = These two conferred secretly,"],"rows":[["1","तौ","PRON","","they",[],"Case=Nom|Gender=Masc|Number=Dual|Person=3|PronType=Prs","_",[]],["2","परस्परम्","ADJ","","mutual",[],"Case=Acc|Gender=Masc|Number=Sing","_",[]],["3","विचारम्","NOUN","","debate",[],"Case=Acc|Gender=Masc|Number=Sing","_",[]],["4","आरब्धौ","VERB","","took",[],"Case=Nom|Gender=Masc|Number=Dual|Tense=Past|VerbForm=Part|Voice=Pass","_",[]],["5","।","PUNCT","",".",[],"_","_",[]]]},"panc1.s100":{"comments":["# text = तत्र दमनक
