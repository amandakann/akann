<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data cleaning summary</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg:#ffffff; --surface:#f4f7f9; --ink:#1b2733; --muted:#5c6b7a; --border:#d4dde4;
  --accent:#2980b9; --hdr:#2c3e50; --hdr-ink:#ffffff; --hdr-link:#cfe3f2;
  --gl-ink:#7d3c98; --clean:#27ae60; --flag:#e67e22;
  --badge-bg:#fdecea; --badge-ink:#b03a2e; --chip-bg:#eaf2f8; --chip-on:#2980b9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#12171d; --surface:#1b222b; --ink:#e6edf3; --muted:#9fb0c0; --border:#2c3a47;
    --accent:#5dade2; --hdr:#0f1620; --hdr-ink:#e6edf3; --hdr-link:#8fc6ec;
    --gl-ink:#c39bd3; --clean:#2ecc71; --flag:#e8853b;
    --badge-bg:#3b241f; --badge-ink:#f1a999; --chip-bg:#22303c; --chip-on:#2980b9;
  }
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: system-ui, sans-serif; margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
#hdr { padding: 8px 16px; background: var(--hdr); color: var(--hdr-ink);
       display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
#hdr h1 { margin: 0; font-size: 1.1em; }
#hdr a { color: var(--hdr-link); font-size: 0.85em; }
#hdr .sub { font-size: 0.8em; opacity: 0.8; margin-left: auto; }
main { padding: 12px 16px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
input[type=search] {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--ink); font-size: 0.95em; min-width: 260px;
}
.count { color: var(--muted); font-size: 0.85em; }
button.more, .tab, .chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9em;
}
.tabs { display: flex; gap: 8px; margin: 8px 0; }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.chip { border-radius: 14px; font-size: 0.8em; }
.chip.active { background: var(--chip-on); color: #fff; border-color: var(--chip-on); }

table { border-collapse: collapse; font-size: 0.9em; width: 100%; }
th { background: var(--surface); padding: 6px 12px; border: 1px solid var(--border);
     text-align: left; cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; }
th::after { content: '\2003'; opacity: 0.35; }
th[data-sort="asc"]::after { content: ' \25B2'; opacity: 1; }
th[data-sort="desc"]::after { content: ' \25BC'; opacity: 1; }
td { padding: 5px 12px; border: 1px solid var(--border); }
tr:hover td { background: var(--surface); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: bold; border-top: 2px solid var(--border); background: var(--surface); }
td.pct { white-space: nowrap; }
.bar { display: inline-block; width: 64px; height: 8px; background: var(--border);
       border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.bar span { display: block; height: 100%; background: var(--clean); }
.pctnum { font-variant-numeric: tabular-nums; }

.ex { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
      margin: 8px 0; background: var(--surface); scroll-margin-top: 12px; }
.ex.flagged { border-left: 3px solid var(--flag); }
.ex.target { outline: 2px solid var(--accent); }
.exhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
          font-size: 0.8em; color: var(--muted); margin-bottom: 2px; }
.exid { font-family: ui-monospace, monospace; }
.badge { background: var(--badge-bg); color: var(--badge-ink); padding: 1px 7px;
         border-radius: 10px; font-size: 0.95em; }
.langnote { background: var(--chip-bg); color: var(--ink); padding: 1px 7px;
            border-radius: 10px; font-size: 0.95em; font-style: italic; }
.igt { margin: 4px 0; }
.igt .tx { font-weight: 600; font-style: italic; }
.igt .morphs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; }
.mcol { display: flex; flex-direction: column; }
.mcol .seg { font-style: italic; }
.mcol .gl { color: var(--gl-ink); font-size: 0.85em; white-space: nowrap; }
/* Empty slots: the cleaner's %%EMPTY%% sentinel and the corpus's own '_'.
   Both mean "nothing here", so they render as a dimmed symbol rather than
   literal text, which otherwise dominates a row of short glosses. */
.mcol .blank { color: var(--muted); opacity: 0.5; font-style: normal;
               font-weight: 400; letter-spacing: 0.05em; }
.igt .tl { color: var(--muted); }
/* "Table view": box each morpheme with gridlines so word boundaries read clearly. */
body.tblview .igt .morphs { gap: 4px; }
body.tblview .mcol { border: 1px solid var(--border); border-radius: 3px; padding: 1px 7px; }
body.tblview .mcol .gl { border-top: 1px solid var(--border); margin-top: 2px; padding-top: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 0.85em;
          color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.cleanlog { font-size: 0.8em; color: var(--muted); margin-top: 4px; }
details.before { margin-top: 6px; }
details.before summary { cursor: pointer; color: var(--accent); font-size: 0.8em; }
.empty, .loading, .error { color: var(--muted); padding: 20px 0; }
.error { color: var(--flag); }
</style>
</head>
<body>
<div id="hdr"><h1>Data cleaning summary</h1><a href="flags.html">Flag types &rarr;</a>
<span class="sub" id="generated"></span></div>
<main>
<div class="toolbar">
  <input type="search" id="filter" placeholder="Filter languages">
  <span class="count" id="totals"></span>
</div>
<div id="tablewrap"><div class="loading">Loading…</div></div>
</main>
<script>

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// An empty slot: the cleaner's %%EMPTY%% sentinel, or the corpus's own '_'.
// Rendered as a dimmed symbol with the real value on hover, so a row of short
// glosses is not swamped by the literal text.
function slotHtml(v, cls){
  if (v === '%%EMPTY%%' || v === '_'){
    var why = (v === '%%EMPTY%%') ? 'empty slot (filled by the cleaner)'
                                  : "empty slot ('_' in the source)";
    return '<span class="' + cls + ' blank" title="' + why + '">\u2205</span>';
  }
  return '<span class="' + cls + '">' + (esc(v) || '\u00A0') + '</span>';
}

function igt(ex){
  var n = Math.max(ex.sg ? ex.sg.length : 0, ex.gl ? ex.gl.length : 0);
  var cols = '';
  for (var i = 0; i < n; i++){
    // Keep empty slots visible so an empty segmentation cell does not let its gloss rise
    // onto the segmentation line.
    var sv = (ex.sg && ex.sg[i] != null) ? ex.sg[i] : '';
    var gv = (ex.gl && ex.gl[i] != null) ? ex.gl[i] : '';
    // A slot blank on BOTH sides cannot occur: drop-padding-slots removes
    // mirrored blanks, so only one side is ever empty here.
    cols += '<div class="mcol">' + slotHtml(sv, 'seg') + slotHtml(gv, 'gl') + '</div>';
  }
  return '<div class="igt"><div class="tx">' + esc(ex.tx) + '</div>' +
         '<div class="morphs">' + cols + '</div>' +
         '<div class="tl">' + esc(ex.tl) + '</div></div>';
}

function exampleCard(ex, opts){
  opts = opts || {};
  var anchor = ex.anchor || '';
  // On the language page the id links to itself (#anchor); on the flag pages it (and the
  // language name) deep-link into the owning language page.
  var idHref = opts.showLang
    ? 'language.html?lang=' + encodeURIComponent(ex.lang) + (anchor ? '#' + anchor : '')
    : '#' + anchor;
  var head = '<div class="exhead"><a class="exid" href="' + idHref + '">' + esc(ex.id) + '</a>';
  if (opts.showLang && ex.langname){
    head += ' <a class="exlang" href="' + idHref + '">' + esc(ex.langname) + '</a>';
  }
  if (ex.note){
    head += ' <span class="langnote">' + esc(ex.note) + '</span>';
  }
  if (ex.flags){
    for (var i = 0; i < ex.flags.length; i++){
      head += ' <span class="badge">' + esc(ex.flags[i]) + '</span>';
    }
  }
  head += '</div>';
  var body = igt(ex);
  if (ex.clean_log) body += '<div class="cleanlog">' + esc(ex.clean_log) + '</div>';
  if (ex.orig){
    body += '<details class="before"><summary>original (before cleaning)</summary>' +
            igt(ex.orig) + '</details>';
  }
  return '<div class="ex' + (opts.flagged ? ' flagged' : '') + '"' +
         (anchor ? ' id="' + anchor + '"' : '') + '>' + head + body + '</div>';
}

function haystack(ex){
  return (ex.id + ' ' + ex.tx + ' ' + (ex.sg||[]).join(' ') + ' ' +
          (ex.gl||[]).join(' ') + ' ' + ex.tl + ' ' + (ex.flags||[]).join(' ') + ' ' +
          (ex.note||'')).toLowerCase();
}

// Incrementally render a filtered list into `mount`, in batches, with a "Load more" button.
function makeRenderer(mount, batch){
  batch = batch || 200;
  return function(list, render, emptyMsg, ensureId){
    mount.innerHTML = '';
    if (!list.length){ mount.innerHTML = '<div class="empty">' + (emptyMsg||'No matches.') + '</div>'; return; }
    var shown = 0;
    var box = document.createElement('div');
    mount.appendChild(box);
    var moreBtn = document.createElement('button');
    moreBtn.className = 'more';
    function draw(){
      var next = Math.min(shown + batch, list.length);
      var html = '';
      for (var i = shown; i < next; i++) html += render(list[i]);
      box.insertAdjacentHTML('beforeend', html);
      shown = next;
      if (shown < list.length){ moreBtn.textContent = 'Load more (' + (list.length - shown) + ' left)'; }
      else if (moreBtn.parentNode){ moreBtn.remove(); }
    }
    moreBtn.addEventListener('click', draw);
    mount.appendChild(moreBtn);
    draw();
    // For a deep link, keep drawing batches until the target card exists, then reveal it.
    if (ensureId){
      while (!document.getElementById(ensureId) && shown < list.length) draw();
      var el = document.getElementById(ensureId);
      if (el){ el.scrollIntoView({ block: 'center' }); el.classList.add('target'); }
    }
  };
}

function debounce(fn, ms){
  var t; return function(){ var a = arguments, self = this;
    clearTimeout(t); t = setTimeout(function(){ fn.apply(self, a); }, ms || 150); };
}

function getParam(name){
  return new URLSearchParams(location.search).get(name);
}

// Interlinear "table view" toggle: a body class (CSS does the styling) remembered across
// pages. Applies the saved preference immediately and wires the checkbox if present.
function initIgtToggle(cb){
  var on = false;
  try { on = localStorage.getItem('igtTable') === '1'; } catch (e) {}
  document.body.classList.toggle('tblview', on);
  if (cb){
    cb.checked = on;
    cb.addEventListener('change', function(){
      document.body.classList.toggle('tblview', cb.checked);
      try { localStorage.setItem('igtTable', cb.checked ? '1' : '0'); } catch (e) {}
    });
  }
}


function pct(x){ return (x * 100).toFixed(1) + '%'; }
// Color a %clean bar on a red -> amber -> green scale by its value.
function barColor(p){ return 'hsl(' + Math.round(p * 120) + ' 65% 45%)'; }

fetch('data/index.json').then(function(r){ return r.json(); }).then(function(data){
  document.getElementById('generated').textContent = 'generated ' + data.generated;
  var t = data.totals;
  function barHtml(prop, label){
    return '<span class="bar"><span style="width:' + (prop * 100).toFixed(1) +
           '%;background:' + barColor(prop) + '"></span></span>' +
           '<span class="pctnum">' + pct(prop) + ' ' + label + '</span>';
  }
  var microProp = (t.clean + t.flagged) ? t.clean / (t.clean + t.flagged) : 0;
  var exTot = t.clean_excl + t.flagged_excl;
  var microExcl = exTot ? t.clean_excl / exTot : 0;
  document.getElementById('totals').innerHTML =
    t.languages + ' languages · ' + t.clean + ' clean · ' + t.flagged + ' flagged · ' +
    barHtml(microProp, 'micro-avg') + ' · ' +
    barHtml(microExcl, 'micro-avg (excl. undefined)') + ' · ' +
    barHtml(t.macro, 'macro-avg');

  var cols = ['Language','Family','Glottocode','Clean','Flagged','Total','% clean'];
  var head = '<tr>' + cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr>';
  var rows = data.languages.map(function(L){
    return '<tr>' +
      '<td><a href="language.html?lang=' + encodeURIComponent(L.file) + '">' + esc(L.name) + '</a></td>' +
      '<td>' + esc(L.family) + '</td>' +
      '<td class="exid">' + esc(L.id) + '</td>' +
      '<td class="num">' + L.clean + '</td>' +
      '<td class="num">' + L.flagged + '</td>' +
      '<td class="num">' + L.total + '</td>' +
      '<td class="pct" data-sort-value="' + L.prop_clean + '">' +
        '<span class="bar"><span style="width:' + (L.prop_clean * 100).toFixed(1) +
          '%;background:' + barColor(L.prop_clean) + '"></span></span>' +
        '<span class="pctnum">' + pct(L.prop_clean) + '</span></td>' +
      '</tr>';
  }).join('');
  var foot = '<tr><td>Total</td><td></td><td></td>' +
    '<td class="num">' + t.clean + '</td><td class="num">' + t.flagged + '</td>' +
    '<td class="num">' + (t.clean + t.flagged) + '</td><td></td></tr>';
  document.getElementById('tablewrap').innerHTML =
    '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table>';

  setupSort(document.querySelector('table'));

  var tbody = document.querySelector('tbody');
  var allRows = Array.prototype.slice.call(tbody.rows);
  document.getElementById('filter').addEventListener('input', debounce(function(e){
    var q = e.target.value.trim().toLowerCase();
    allRows.forEach(function(tr){
      var txt = (tr.cells[0].textContent + ' ' + tr.cells[1].textContent + ' ' +
                 tr.cells[2].textContent).toLowerCase();
      tr.style.display = (!q || txt.indexOf(q) >= 0) ? '' : 'none';
    });
  }, 120));
}).catch(function(e){
  document.getElementById('tablewrap').innerHTML = '<div class="error">Failed to load data: ' + e + '</div>';
});

function setupSort(table){
  if (!table) return;
  var tbody = table.tBodies[0];
  var headers = Array.prototype.slice.call(table.tHead.rows[0].cells);
  var sortCol = -1, sortDir = 1;
  headers.forEach(function(th, idx){
    th.addEventListener('click', function(){
      sortDir = (sortCol === idx) ? -sortDir : 1;
      sortCol = idx;
      var rows = Array.prototype.slice.call(tbody.rows);
      rows.sort(function(a, b){
        var ca = a.cells[idx], cb = b.cells[idx];
        var at = ca.dataset.sortValue != null ? ca.dataset.sortValue : ca.textContent.trim();
        var bt = cb.dataset.sortValue != null ? cb.dataset.sortValue : cb.textContent.trim();
        var an = parseFloat(at), bn = parseFloat(bt);
        var numeric = !isNaN(an) && !isNaN(bn);
        var cmp = numeric ? an - bn : at.localeCompare(bt);
        return cmp * sortDir;
      });
      rows.forEach(function(r){ tbody.appendChild(r); });
      headers.forEach(function(h){ h.removeAttribute('data-sort'); });
      th.setAttribute('data-sort', sortDir > 0 ? 'asc' : 'desc');
    });
  });
}
</script>
</body>
</html>
