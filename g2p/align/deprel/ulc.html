<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deprel &mdash; Ulch-GDUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tangut&display=swap">
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
#hdr { padding: 8px 16px; background: #2c3e50; color: #fff; flex-shrink: 0; position: relative; }
#hdr h1 { margin: 0; font-size: 1.1em; }
#hdr a.back { position: absolute; top: 8px; right: 16px; color: #cfe3f2; font-size: 0.85em; text-decoration: none; }
#hdr a.back:hover { text-decoration: underline; }
#stats { margin: 2px 0 0; font-size: 0.8em; opacity: 0.8; }
#matrix-section { padding: 12px 16px; overflow-x: auto; }
#sentences-section { padding: 12px 16px; border-top: 2px solid #bbb; }
#sel-hdr { font-weight: bold; margin-bottom: 10px; color: #2c3e50; min-height: 1.4em; }
#placeholder { color: #aaa; font-style: italic; padding: 40px; text-align: center; }
table { border-collapse: collapse; font-size: 0.75em; }
th { background: #ecf0f1; position: sticky; top: 0; z-index: 1; padding: 4px 6px; border: 1px solid #bbb; }
th.rh { text-align: left; position: sticky; left: 0; z-index: 2; }
th.col-label { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; vertical-align: bottom; height: 120px; padding: 4px 2px; text-align: left; }
td { padding: 3px 8px; border: 1px solid #ddd; text-align: right; min-width: 36px; font-variant-numeric: tabular-nums; }
td.diag { background: #f0f0f0; color: #999; }
td.click { cursor: pointer; }
td.click:hover { filter: brightness(0.88); }
td.sel { outline: 2px solid #2980b9; outline-offset: -2px; }
.pair { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
.pair-id { background: #f8f8f8; padding: 3px 10px; font-size: 0.82em; color: #555; border-bottom: 1px solid #ddd; font-family: monospace; }
.pair-id a { color: #2980b9; text-decoration: underline; font-size: 1.1em; }
.pair-id a:hover { color: #1a5276; }
.sent-comments { font-family: monospace, "Noto Serif Tangut"; font-size: 0.73em; color: #555; padding: 3px 8px; border-bottom: 1px solid #eee; }
.sent-tbl { width: 100%; border-collapse: collapse; font-size: 0.72em; font-family: monospace, "Noto Serif Tangut"; }
.sent-tbl th, .sent-tbl td { padding: 2px 6px; border: 1px solid #ddd; text-align: left; white-space: nowrap; }
.sent-tbl th { background: #ecf0f1; font-family: system-ui, sans-serif; }
.sent-tbl th.pred-col, .sent-tbl td.pred-col { background: #eaf4fb; }
.sent-tbl th:nth-child(4), .sent-tbl td:nth-child(4),
.sent-tbl th:nth-child(10), .sent-tbl td:nth-child(10),
.sent-tbl th:nth-child(13), .sent-tbl td:nth-child(13) { border-left: 2px solid #aaa; }
.sent-tbl th:nth-child(6), .sent-tbl td:nth-child(6),
.sent-tbl th:nth-child(8), .sent-tbl td:nth-child(8) { border-left: 1.5px solid #aaa; }
tr.hl-line td { background: #fffbcc !important; }
tr.hl-line td.pred-col { background: #fff5a0 !important; }
.sent-tbl td.mismatch { background: #fde8e8; }
</style>
</head>
<body>
<div id="hdr">
  <a class="back" href="../index.html">&larr; Index</a>
  <h1>Ulch-GDUD</h1>
  <div id="stats">38 sents &middot; 43 tokens &middot; UPOS 72.1% &middot; UAS 95.3% &middot; LAS 62.8% &middot; CLAS 62.8% &middot; CORELAS 66.7% &middot; DEPREL 62.8%</div>
</div>
<div id="matrix-section"><table id="tbl"></table></div>
<div id="sentences-section">
  <div id="sel-hdr"></div>
  <div id="list"><div id="placeholder">Click a confusion cell to see examples</div></div>
</div>
<script>
const M = {"advmod":{"advmod":1},"amod":{},"compound":{},"conj":{},"nsubj":{"nsubj":1},"obj":{},"obl":{"nsubj":1,"obj":1,"root":1},"punct":{},"root":{"advmod":2,"amod":4,"compound":2,"conj":2,"obj":1,"obl":1,"punct":1,"root":25}};
const S = {"root→conj":[["Ulch_grammar_1",["1"]],["Ulch_grammar_17",["1"]]],"root→amod":[["Ulch_grammar_22",["1"]],["Ulch_grammar_35",["1"]],["Ulch_grammar_37",["1"]],["Ulch_grammar_47",["1"]]],"root→advmod":[["Ulch_grammar_30",["1"]],["Ulch_grammar_52",["1"]]],"root→compound":[["Ulch_grammar_43",["1"]],["Ulch_grammar_50",["1"]]],"root→obj":[["Ulch_grammar_46",["1"]]],"root→obl":[["Ulch_grammar_51",["1"]]],"root→punct":[["Ulch_grammar_60",["2"]]],"obl→nsubj":[["Ulch_grammar_29",["1"]]],"obl→obj":[["Ulch_grammar_39",["2"]]],"obl→root":[["Ulch_grammar_60",["1"]]]};
const SENTS = {"Ulch_grammar_1":{"comments":["# sent_id = Ulch_grammar_1","# text = ajačuxá","# text[eng] = He corrected / she repaired / she mended"],"rows":[["1","ajačuxá","ajaču","VERB","VERB","0","0","root","conj","mended","fix","fix-PST.3SG","Number=Sing|Person=3|Tense=Past"]]},"Ulch_grammar_17":{"comments":["# sent_id = Ulch_grammar_17","# text = bu-xá","# text[eng] = He gave / He was giving"],"rows":[["1","bu-xá","bu-xá","VERB","VERB","0","0","root","conj","giving","give","give-PST.3SG","Number=Sing|Person=3|Tense=Past"]]},"Ulch_grammar_22":{"comments":["# sent_id = Ulch_grammar_22","# text = byidu-dí","# text[eng] = pregnant woman"],"rows":[["1","byidu-dí","byidu-dí","NOUN","ADJ","0","0","root","amod","pregnant","pregnant","pregnant-woman","_"]]},"Ulch_grammar_35":{"comments":["# sent_id = Ulch_grammar_35","# text = mafá","# text[eng] = old man"],"rows":[["1","mafá","mafá","NOUN","ADJ","0","0","root","amod","old","old","old.man","_"]]},"Ulch_grammar_37":{"comments":["# sent_id = Ulch_grammar_37","# text = mamá","# text[eng] = old woman"],"rows":[["1","mamá","mamá","NOUN","ADJ","0","0","root","amod","old","old","old.woman","_"]]},"Ulch_grammar_47":{"comments":["# sent_id = Ulch_grammar_47","# text = nyú","# text[eng] = younger sibling"],"rows":[["1","nyú","nyú","NOUN","ADJ","0","0","root","amod","younger","younger","younger.sibling","_"]]},"Ulch_grammar_30":{"comments":["# sent_id = Ulch_grammar_30","# text = kuś-kongoré","# text[eng] = to jump out"],"rows":[["1","kuś-kongoré","kuś-kongoré","VERB","ADV","0","0","root","advmod","out","jump","jump-out","VerbForm=Inf"]]},"Ulch_grammar_52":{"comments":["# sent_id = Ulch_grammar_52","# text = pej-pej","# text[eng] = (A fish) jumps out repeatedly"],"rows":[["1","pej-pej","pej-pej","VERB","ADV","0","0","root","advmod","repeatedly","jump","jump.out.IDEO","Mood=Ind|VerbForm=Fin"]]},"Ulch_grammar_43":{"comments":["# sent_id = Ulch_grammar_43","# text = ńur-xyni","# text[eng] = He wrote down"],"rows":[["1","ńur-xyni","ńur","VERB","ADP","0","0","root","compound:prt","down","write","write-PST.3SG","Number=Sing|Person=3|Tense=Past"]]},"Ulch_grammar_50":{"comments":["# sent_id = Ulch_grammar_50","# text = palźá","# text[eng] = stair step"],"rows":[["1","palźá","palźá","NOUN","NOUN","0","0","root","compound","stair","stair","stair.step","_"]]},"Ulch_grammar_46":{"comments":["# sent_id = Ulch_grammar_46","# text = nýŋman-dý","# text[eng] = Tell a fairy tale"],"rows":[["1","nýŋman-dý","nýŋman-dý","VERB","NOUN","0","0","root","obj","tale","fairy","fairy.tale-say","VerbForm=Inf"]]},"Ulch_grammar_51":{"comments":["# sent_id = Ulch_grammar_51","# text = patalma-sí","# text[eng] = secretly visit at night"],"rows":[["1","patalma-sí","patalma-sí","VERB","NOUN","0","0","root","obl","night","night","night.go.secretly","VerbForm=Inf"]]},"Ulch_grammar_60":{"comments":["# sent_id = Ulch_grammar_60","# text = Dǖe-mi ē-chi-ŋ","# text[eng] = Don't enter the house!"],"rows":[["1","Dǖe-mi","dǖe","NOUN","AUX","2","0","obl","root","Don","mi","","Case=Acc"],["2","ē-chi-ŋ","ē","VERB","PUNCT","0","1","root","punct","!","enter","enter-NEG-IMP.2SG","Mood=Imp|Person=2|Polarity=Neg"]]},"Ulch_grammar_29":{"comments":["# sent_id = Ulch_grammar_29","# text = kindaram-dé osłabł","# text[eng] = He got weakened"],"rows":[["1","kindaram-dé","kindaram","NOUN","PRON","2","2","obl","nsubj:pass","He","man","man-LOC","Case=Loc"],["2","osłabł","osłabł","VERB","VERB","0","0","root","root","weakened","weaken","weaken-PST.3SG","Number=Sing|Person=3|Tense=Past"]]},"Ulch_grammar_39":{"comments":["# sent_id = Ulch_grammar_39","# text = bi simbi mirym-búj","# text[eng] = I will marry you"],"rows":[["1","bi","bi","PRON","PRON","3","3","nsubj","nsubj","I","I","1SG","Number=Sing|Person=1|PronType=Prs"],["2","simbi","simbi","PRON","PRON","3","3","obl","obj","you","you","you(COM)","Number=Sing|Person=2|PronType=Prs"],["3","mirym-búj","mirym","VERB","VERB","0","0","root","root","marry","marry","marry-FUT.1SG","Number=Sing|Person=1|Tense=Fut"]]}};
const TREEBANK = "Ulch-GDUD";
const labels = Object.keys(M).sort();
const tbl = document.getElementById('tbl');

let maxV = 1;
for (const g of labels)
  for (const p of labels)
    if (g !== p && M[g] && M[g][p]) maxV = Math.max(maxV, M[g][p]);

const hrow = tbl.insertRow();
const corner = document.createElement('th');
corner.className = 'rh';
corner.textContent = 'gold \ pred';
hrow.appendChild(corner);
for (const p of labels) {
  const th = document.createElement('th');
  th.className = 'col-label';
  th.textContent = p;
  hrow.appendChild(th);
}

let sel = null;
for (const g of labels) {
  const row = tbl.insertRow();
  const rh = document.createElement('th');
  rh.className = 'rh';
  rh.textContent = g;
  row.appendChild(rh);
  for (const p of labels) {
    const td = row.insertCell();
    const cnt = (M[g] && M[g][p]) || 0;
    td.textContent = cnt || '';
    if (g === p) {
      td.className = 'diag';
      td.title = cnt + ' correct';
    } else if (cnt > 0) {
      const t = cnt / maxV;
      const ch = Math.round(255 * (1 - t * 0.8));
      td.style.background = 'rgb(255,' + ch + ',' + ch + ')';
      td.id = g + '--' + p;
      td.className = 'click';
      td.title = 'gold:' + g + ' → pred:' + p + ': ' + cnt;
      td.addEventListener('click', (function(gl, pl, c, cell) {
        return function() { show(gl, pl, c, cell); };
      })(g, p, cnt, td));
    }
  }
}

function show(gL, pL, cnt, cell) {
  history.replaceState(null, '', '#' + gL + '--' + pL);
  if (sel) sel.classList.remove('sel');
  cell.classList.add('sel');
  sel = cell;
  document.getElementById('sel-hdr').textContent =
    'gold: ' + gL + '  →  pred: ' + pL + '  (' + cnt + ' sentence' + (cnt !== 1 ? 's' : '') + ')';
  document.getElementById('sentences-section').scrollIntoView({ behavior: 'smooth' });
  const list = document.getElementById('list');
  list.innerHTML = '';
  const corpus = (TREEBANK.startsWith('UD_') ? TREEBANK : 'UD_' + TREEBANK) + '@2.18';
  const sents = S[gL + '→' + pL] || [];
  for (const [sid, tids] of sents) {
    const sent = SENTS[sid] || {};
    const grewUrl = 'https://universal.grew.fr/?corpus=' + corpus +
      '&request=' + encodeURIComponent('pattern { meta.sent_id = "' + sid + '" }');
    const d = document.createElement('div');
    d.className = 'pair';
    d.innerHTML =
      '<div class="pair-id"><a href="' + grewUrl + '" target="_blank">' + esc(sid) + '</a></div>' +
      '<div style="overflow-x:auto">' + renderTable(sent.comments, sent.rows, tids) + '</div>';
    list.appendChild(d);
  }
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const HDRS = ["ID", "FORM", "LEMMA", "UPOS", "UPOS·p", "HEAD", "HEAD·p", "DEPREL", "DEPREL·p", "AlignedToken", "AlignGloss", "Gloss", "FEATS"];
const PRED_COLS = new Set([4, 6, 8]);
const PRED_GOLD = new Map([[4, 3], [6, 5], [8, 7]]);

function renderTable(comments, rows, tokenIds) {
  const ids = new Set(tokenIds || []);
  let h = '';
  if (comments && comments.length)
    h += '<div class="sent-comments">' + comments.map(esc).join('<br>') + '</div>';
  h += '<table class="sent-tbl"><thead><tr>';
  HDRS.forEach((hdr, i) => {
    h += '<th' + (PRED_COLS.has(i) ? ' class="pred-col"' : '') + '>' + esc(hdr) + '</th>';
  });
  h += '</tr></thead><tbody>';
  for (const row of rows) {
    const hl = ids.has(row[0]);
    h += '<tr' + (hl ? ' class="hl-line"' : '') + '>';
    row.forEach((cell, i) => {
      const goldIdx = PRED_GOLD.get(i);
      const mismatch = goldIdx !== undefined && cell !== row[goldIdx];
      const cls = (PRED_COLS.has(i) ? 'pred-col' : '') + (mismatch ? ' mismatch' : '');
      h += '<td' + (cls.trim() ? ' class="' + cls.trim() + '"' : '') + '>' + esc(cell) + '</td>';
    });
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

if (location.hash) {
  const cell = document.getElementById(location.hash.slice(1));
  if (cell) { cell.click(); cell.scrollIntoView({ behavior: 'instant', block: 'center' }); }
}
</script>
</body>
</html>
