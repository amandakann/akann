(function () {
  const conds = DATA.conditions;
  const table = document.querySelector('table');
  let metric = new URLSearchParams(location.hash.slice(1)).get('metric') || 'las';
  if (!DATA.metrics.includes(metric)) metric = 'las';
  let sortCol = -1, sortDir = 1;

  const fmt = (v) => v == null ? '-' : (metric === 'tokens' ? String(v) : (v * 100).toFixed(1) + '%');
  function cells(vals, tips, links) {
    const best = metric === 'tokens' ? null :
      Math.max(...vals.filter(v => v != null));
    return vals.map((v, i) => {
      let txt = fmt(v);
      if (links && links[i]) txt = `<a href="${links[i]}">${txt}</a>`;
      const cls = 'num' + (best != null && v === best ? ' best' : '');
      const tip = tips && tips[i] ? ` title="${tips[i]}"` : '';
      return `<td class="${cls}"${tip}>${txt}</td>`;
    }).join('');
  }

  function render() {
    const ctl = document.getElementById('ctl');
    ctl.innerHTML = 'Metric: ' + DATA.metrics.map(m =>
      `<button data-m="${m}" class="${m === metric ? 'on' : ''}">${DATA.labels[m]}</button>`).join('');
    ctl.querySelectorAll('button').forEach(b => b.onclick = () => {
      metric = b.dataset.m; location.hash = 'metric=' + metric; render();
    });

    table.tHead.innerHTML = '<tr><th>name</th><th>treebank</th>' +
      conds.map(c => `<th>${c}</th>`).join('') + '</tr>';
    table.tBodies[0].innerHTML = DATA.rows.map(r =>
      `<tr><td>${r.name}</td><td>${r.treebank}</td>` +
      cells(r.cells.map(c => c[metric]), r.cells.map(c => `${c.sents} sents, ${c.tokens} tokens`),
            r.cells.map(c => c.links[metric])) + '</tr>').join('');
    table.tFoot.innerHTML = ['macro', 'micro'].map(k =>
      `<tr><td>${k} avg</td><td>${DATA.rows.length} treebanks</td>` +
      cells(DATA.avgs[k].map(a => a[metric])) + '</tr>').join('');

    const headers = Array.from(table.tHead.rows[0].cells);
    headers.forEach((th, idx) => th.onclick = () => {
      sortDir = (sortCol === idx) ? -sortDir : 1; sortCol = idx; sort();
    });
    if (sortCol >= 0) sort();
  }

  function sort() {
    const tbody = table.tBodies[0];
    const rows = Array.from(tbody.rows);
    rows.sort((a, b) => {
      const at = a.cells[sortCol].textContent.trim(), bt = b.cells[sortCol].textContent.trim();
      const an = parseFloat(at), bn = parseFloat(bt);
      return (!isNaN(an) && !isNaN(bn) ? an - bn : at.localeCompare(bt)) * sortDir;
    });
    rows.forEach(r => tbody.appendChild(r));
    const headers = Array.from(table.tHead.rows[0].cells);
    headers.forEach(h => h.removeAttribute('data-sort'));
    headers[sortCol].setAttribute('data-sort', sortDir > 0 ? 'asc' : 'desc');
  }

  render();
})();
