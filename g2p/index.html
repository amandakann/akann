(function () {
  const conds = DATA.conditions;
  const table = document.querySelector('table');
  const hash = new URLSearchParams(location.hash.slice(1));
  let metric = hash.get('metric') || 'las';
  if (!DATA.metrics.includes(metric)) metric = 'las';
  // Shown conditions (model selector), kept in the URL hash as show=a,b.
  const shownList = hash.has('show') ? hash.get('show').split(',').filter(c => conds.includes(c))
    : (DATA.default_shown.length ? DATA.default_shown : conds);
  const hidden = new Set(conds.filter(c => !shownList.includes(c)));
  // Sort by key ('name', 'treebank', 'sents', 'tokens' or a condition), so it
  // survives columns being hidden.
  let sortKey = null, sortDir = 1;

  function saveHash() {
    const h = new URLSearchParams({metric});
    h.set('show', conds.filter(c => !hidden.has(c)).join(','));
    history.replaceState(null, '', '#' + h.toString().replace(/%2C/g, ','));
  }

  const fmt = (v) => v == null ? '-' : (v * 100).toFixed(1) + '%';
  // partial[i]: column i's value is a partial average (shown with an asterisk,
  // never highlighted as best, since it covers fewer treebanks).
  function cells(vals, links, partial, coverage) {
    const best = Math.max(...vals.filter((v, i) => v != null && !(partial && partial[i])));
    return vals.map((v, i) => {
      let txt = fmt(v);
      if (links && links[i]) txt = `<a href="${links[i]}">${txt}</a>`;
      let cls = 'num' + (v === best ? ' best' : '') + (v == null ? ' missing' : '');
      let title = '';
      if (partial && partial[i] && v != null) {
        txt += '*';
        cls += ' partial';
        title = ` title="partial average: ${coverage[i]} of ${DATA.rows.length} treebanks"`;
      }
      return `<td class="${cls}"${title}>${txt}</td>`;
    }).join('');
  }
  const partial = DATA.coverage.map(n => n < DATA.rows.length);

  function renderControls() {
    const ctl = document.getElementById('ctl');
    ctl.innerHTML = '<span class="lbl">Metric:</span>' + DATA.metrics.map(m =>
      `<button data-m="${m}" class="${m === metric ? 'on' : ''}">${DATA.labels[m]}</button>`).join('');
    ctl.querySelectorAll('button').forEach(b => b.onclick = () => {
      metric = b.dataset.m; saveHash(); render();
    });

    const models = document.getElementById('models');
    models.innerHTML = '<span class="lbl">Models:</span>' + DATA.groups.map(([g, ms], gi) =>
      `<span class="grp"><span class="glbl" data-g="${gi}" title="toggle all ${g}">${g}</span>` +
      ms.map(([c, short, tip]) =>
        `<button data-c="${c}" title="${tip}" class="${hidden.has(c) ? '' : 'on'}">${short}</button>`).join('') +
      '</span>').join('') +
      '<span class="sep"></span><button data-all="1">all</button><button data-all="0">none</button>';
    models.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (b.dataset.all === '1') hidden.clear();
      else if (b.dataset.all === '0') conds.forEach(c => hidden.add(c));
      else if (hidden.has(b.dataset.c)) hidden.delete(b.dataset.c);
      else hidden.add(b.dataset.c);
      saveHash(); render();
    });
    // A group label shows the whole group, or hides it if it is all shown already.
    models.querySelectorAll('.glbl').forEach(l => l.onclick = () => {
      const ms = DATA.groups[l.dataset.g][1].map(m => m[0]);
      if (ms.every(c => !hidden.has(c))) ms.forEach(c => hidden.add(c));
      else ms.forEach(c => hidden.delete(c));
      saveHash(); render();
    });
  }

  function render() {
    renderControls();
    const vis = conds.map((c, i) => i).filter(i => !hidden.has(conds[i]));
    const pick = (arr) => vis.map(i => arr[i]);
    const visPartial = pick(partial);
    const visCoverage = pick(DATA.coverage);
    const keys = ['name', 'treebank', 'sents', 'tokens', ...pick(conds)];

    table.tHead.innerHTML = '<tr><th>name</th><th>treebank</th>' +
      '<th title="Parsed sentences / total (from gold data)">sents</th><th title="Parsed tokens">tokens</th>' +
      pick(conds).map(c => `<th>${c}</th>`).join('') + '</tr>';
    table.tBodies[0].innerHTML = DATA.rows.map(r =>
      `<tr><td>${r.name}</td><td>${r.treebank}</td>` +
      `<td class="num">${r.sents}</td><td class="num">${r.tokens ?? '?'}</td>` +
      cells(pick(r.cells).map(c => c ? c[metric] : null), pick(r.cells).map(c => c ? c.links[metric] : null)) + '</tr>').join('');
    table.tFoot.innerHTML = ['macro', 'micro'].map(k =>
      `<tr><td>${k} avg</td><td>${DATA.rows.length} treebanks</td><td></td>` +
      `<td class="num">${k === 'micro' ? DATA.total_tokens : ''}</td>` +
      cells(pick(DATA.avgs[k]).map(a => a[metric]), null, visPartial, visCoverage) + '</tr>').join('');

    const headers = Array.from(table.tHead.rows[0].cells);
    headers.forEach((th, idx) => th.onclick = () => {
      sortDir = (sortKey === keys[idx]) ? -sortDir : 1; sortKey = keys[idx]; sort(keys);
    });
    if (keys.includes(sortKey)) sort(keys);
  }

  function sort(keys) {
    const col = keys.indexOf(sortKey);
    const tbody = table.tBodies[0];
    const rows = Array.from(tbody.rows);
    rows.sort((a, b) => {
      const at = a.cells[col].textContent.trim(), bt = b.cells[col].textContent.trim();
      const an = parseFloat(at), bn = parseFloat(bt);
      return (!isNaN(an) && !isNaN(bn) ? an - bn : at.localeCompare(bt)) * sortDir;
    });
    rows.forEach(r => tbody.appendChild(r));
    const headers = Array.from(table.tHead.rows[0].cells);
    headers.forEach(h => h.removeAttribute('data-sort'));
    headers[col].setAttribute('data-sort', sortDir > 0 ? 'asc' : 'desc');
  }

  render();
})();
